<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareerPilot · İlan ara</title><link rel="stylesheet" href="/quick.css"><script defer src="/quick.js"></script></head>
<body><header><strong>CareerPilot</strong><span>İlan keşfi</span></header><main><div class="heading"><h1>İlan keşfi</h1><a href="#search">Arama tercihleri ↓</a></div><div class="workspace">
<form id="search"><h2>Arama tercihleri</h2><fieldset><legend>Pozisyonlar</legend><div id="roles"></div><details><summary>Diğer roller</summary><div id="extra-roles"></div></details></fieldset>
<label class="city">Şehir<input id="city" maxlength="80" required></label>
<fieldset><legend>Çalışma biçimi</legend><label><input type="checkbox" id="office"> Şehirde ofisten</label><label><input type="checkbox" id="hybrid"> Şehirde hibrit</label><label><input type="checkbox" id="remote"> Türkiye’den uzaktan</label></fieldset>
<label><input type="checkbox" id="junior"> Junior / yeni mezun (0–2 yıl hedefi)</label>
<label><input type="checkbox" id="includeUnclear"> Deneyimi belirsiz ilanları da göster</label>
<p id="save" role="status"></p><button id="go" disabled>Ücretsiz ilan ara</button><button type="button" id="stop" hidden>Taramayı durdur</button></form>
<section class="results"><h2>İlanlar</h2><p id="panel-hint" class="small" hidden>CV ve ön yazı için önce CareerPilot Panel uygulamasını aç.</p><p aria-live="polite" id="summary">Rollerini seçip aramayı başlat.</p><ul id="jobs"></ul><details id="sources" hidden><summary>Kaynak raporu</summary><ul id="report"></ul></details></section></div></main></body></html>

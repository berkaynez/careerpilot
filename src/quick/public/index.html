<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareerPilot · İlan ara</title><link rel="stylesheet" href="/quick.css"><script defer src="/quick.js"></script></head>
<body><main><header>CareerPilot</header><h1>İlan ara</h1>
